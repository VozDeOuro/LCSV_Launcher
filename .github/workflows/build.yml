name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build openjdk-21-jdk \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libqt6svg6-dev libqt6networkauth6-dev \
            libgl1-mesa-dev libssl-dev libcurl4-openssl-dev gamemode-dev \
            libarchive-dev cmark libcmark-dev zlib1g-dev \
            extra-cmake-modules

      - name: Configure
        env:
          ARTIFACT_NAME: linux-x86_64
          BUILD_PLATFORM: official
        run: cmake --preset linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build --preset linux --config Release

      - name: Test
        run: ctest --preset linux --build-config Release --output-on-failure

  build-windows:
    name: Build (Windows)
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-svg
            mingw-w64-clang-x86_64-qt6-tools
            mingw-w64-clang-x86_64-qt6-networkauth
            mingw-w64-clang-x86_64-libarchive
            mingw-w64-clang-x86_64-cmark
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-extra-cmake-modules
            mingw-w64-clang-x86_64-jdk-adopt-openj9

      - name: Configure
        env:
          ARTIFACT_NAME: windows-x86_64
          BUILD_PLATFORM: official
        run: cmake --preset windows_mingw -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build --preset windows_mingw --config Release
