name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach assets to (e.g. v2.3.0)'
        required: true
        default: 'v2.3.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run dist:win -- --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          gh release upload "$TAG" dist/*.exe dist/*.blockmap dist/latest.yml --clobber
        shell: bash

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run dist:linux -- --publish never
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.event.inputs.tag || github.ref_name }}
          gh release create "$TAG" --title "$TAG" --notes "Automated release" 2>/dev/null || true
          gh release upload "$TAG" dist/*.AppImage dist/latest-linux.yml --clobber
        shell: bash
