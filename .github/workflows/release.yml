name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build openjdk-21-jdk \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools libqt6svg6-dev libqt6networkauth6-dev \
            libgl1-mesa-dev libssl-dev libcurl4-openssl-dev libgamemode-dev \
            libarchive-dev cmark libcmark-dev zlib1g-dev \
            extra-cmake-modules

      - name: Get version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        env:
          ARTIFACT_NAME: linux-x86_64
          BUILD_PLATFORM: official
        run: |
          cmake --preset linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DLauncher_UPDATER_GITHUB_REPO="https://github.com/${{ github.repository }}" \
            -DLauncher_BUILD_ARTIFACT=linux-x86_64

      - name: Build
        run: cmake --build --preset linux --config Release

      - name: Install
        run: cmake --install build --config Release --prefix install

      - name: Package
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          ARCHIVE="LCSVLauncher-${VERSION}-linux-x86_64.tar.gz"
          tar -czf "${ARCHIVE}" -C install .
          echo "ARTIFACT=${ARCHIVE}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ${{ env.ARTIFACT }}

  build-windows:
    name: Build Windows
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-toolchain
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-svg
            mingw-w64-clang-x86_64-qt6-tools
            mingw-w64-clang-x86_64-qt6-networkauth
            mingw-w64-clang-x86_64-libarchive
            mingw-w64-clang-x86_64-cmark
            mingw-w64-clang-x86_64-zlib
            mingw-w64-clang-x86_64-extra-cmake-modules
            mingw-w64-clang-x86_64-nsis

      - name: Get version
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Configure
        env:
          ARTIFACT_NAME: windows-x86_64
          BUILD_PLATFORM: official
        run: |
          cmake --preset windows_mingw \
            -DCMAKE_BUILD_TYPE=Release \
            -DLauncher_UPDATER_GITHUB_REPO="https://github.com/${{ github.repository }}" \
            -DLauncher_BUILD_ARTIFACT=windows-x86_64

      - name: Build
        run: cmake --build --preset windows_mingw --config Release

      - name: Install
        run: cmake --install build --config Release --prefix build/program_info

      - name: Deploy Qt
        run: |
          cd build/program_info
          windeployqt6 lcsv-launcher.exe

      - name: Package (NSIS installer)
        run: |
          cd build/program_info
          makensis win_install.nsi

      - name: Rename artifact
        shell: bash
        run: |
          VERSION=${{ steps.ver.outputs.version }}
          mv build/LCSVLauncher-Setup.exe "LCSVLauncher-${VERSION}-windows-x86_64.exe"
          echo "ARTIFACT=LCSVLauncher-${VERSION}-windows-x86_64.exe" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.ARTIFACT }}

  create-release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LCSV Launcher ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/*
          fail_on_unmatched_files: true
